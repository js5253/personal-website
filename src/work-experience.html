---
layout: layout.html
title: Work Experience
---
{% for project in collections.work-experience %}
<div class="job" id="{{project.data.slug}}">
    <h4>{{project.data.title}}</h4>
    {% if project.subtitle %}
    <h5>{{project.data.subtitle}}</h5>
    {% endif %}
    <ul>
        {{project.content}}
    </ul>
</div>
{% endfor %}
